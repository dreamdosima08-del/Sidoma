  {
    kategori: '😄 Artvinli Refleksleri',
    soru: "Artvin\'de hava nasıl olursa olursa \"yağmur yağar\" denir, peki Artvin yılda kaç gün yağmur alır?",
    siklar: ['50-80 gün', '80-110 gün', 'Yaklaşık 140 gün', '200+ gün'],
    dogru: 2,
    aciklama: "Artvin\'in bazı ilçeleri yılda 150-200 günü aşkın yağışlı gün görebilir. Bu yüzden Artvinliler yağmura aldırmaz! 🌧️"
  },
  {
    kategori: '🏔️ Artvin Coğrafyası',
    soru: "Artvin\'in Kaçkar\'dan sonra ikinci en yüksek dağı hangisidir?",
    siklar: ['Cerattepe', 'Karçal Dağları', 'Mescit Dağı', 'Yalnızçam'],
    dogru: 1,
    aciklama: "Karçal Dağları, 3.428 metre ile Artvin\'in ikinci en yüksek noktasıdır ve Gürcistan sınırına kadar uzanır."
  }
];

let mevcutSoru = 0;
let puan = 0;
let dogru = 0;
let cevaplandi = false;

function baslat(){
  mevcutSoru=0; puan=0; dogru=0; cevaplandi=false;
  document.getElementById('ekranBaslangic').style.display='none';
  document.getElementById('ekranSonuc').style.display='none';
  document.getElementById('ekranSoru').style.display='block';
  soruGoster();
}

function soruGoster(){
  cevaplandi=false;
  const s = SORULAR[mevcutSoru];

  document.getElementById('ilerlemeNo').textContent = 'Soru '+(mevcutSoru+1)+' / '+SORULAR.length;
  document.getElementById('ilerlemePuan').textContent = puan+' puan';
  document.getElementById('ilerlemeIc').style.width = ((mevcutSoru/SORULAR.length)*100)+'%';
  document.getElementById('soruKategori').textContent = s.kategori;
  document.getElementById('soruMetin').textContent = s.soru;
  document.getElementById('aciklamaKutu').classList.remove('on');
  document.getElementById('aciklamaKutu').textContent='';
  document.getElementById('btnIleri').classList.remove('on');

  const siklar = document.getElementById('siklar');
  siklar.innerHTML='';
  const harfler=['A','B','C','D'];
  s.siklar.forEach(function(sik,i){
    const btn = document.createElement('button');
    btn.className='sik';
    btn.innerHTML='<span class="sik-harf">'+harfler[i]+'</span>'+sik;
    btn.onclick=function(){ cevapSec(i,btn); };
    siklar.appendChild(btn);
  });
}

function cevapSec(idx, btn){
  if(cevaplandi) return;
  cevaplandi=true;
  const s = SORULAR[mevcutSoru];
  const tumSiklar = document.querySelectorAll('.sik');

  tumSiklar.forEach(function(b){ b.disabled=true; });

  if(idx===s.dogru){
    btn.classList.add('dogru');
    puan+=10; dogru++;
  } else {
    btn.classList.add('yanlis');
    tumSiklar[s.dogru].classList.add('dogru');
    tumSiklar.forEach(function(b,i){
      if(i!==idx && i!==s.dogru) b.classList.add('gri');
    });
  }

  // Açıklama göster
  const ac = document.getElementById('aciklamaKutu');
  ac.innerHTML='<span class="aciklama-ikon">💡</span>'+s.aciklama;
  ac.classList.add('on');

  document.getElementById('ilerlemePuan').textContent = puan+' puan';

  const btnIleri = document.getElementById('btnIleri');
  btnIleri.textContent = mevcutSoru < SORULAR.length-1 ? 'Sonraki Soru →' : 'Sonucu Gör 🏆';
  btnIleri.classList.add('on');
}

function sonraki(){
  mevcutSoru++;
  if(mevcutSoru>=SORULAR.length){
    sonucGoster();
  } else {
    soruGoster();
  }
}

function sonucGoster(){
  document.getElementById('ekranSoru').style.display='none';
  const sonuc = document.getElementById('ekranSonuc');
  sonuc.style.display='flex';

  const yuzde = Math.round((puan/150)*100);
  let rozet, unvan, mesaj, rozetRenk;

  if(puan<=40){
    rozet='🗺️'; unvan='Artvin Turist 😄';
    mesaj='Sen daha Artvin\'i Google Maps\'ten görmüşsün! Ama merak etme, her yolculuk bir adımla başlar. Artvin seni bekliyor!';
    rozetRenk='rgba(255,200,50,.3)';
  } else if(puan<=70){
    rozet='🌱'; unvan='Yavaş Yavaş Artvinleşiyorsun';
    mesaj='Artvin\'i tanımaya başlıyorsun! Bir de Kafkasör\'e çıksan, bir de Demirkent\'in hinkalını yesen... O zaman konuşuruz!';
    rozetRenk='rgba(80,180,120,.3)';
  } else if(puan<=110){
    rozet='🏔️'; unvan='Artvin Havası Var Sende!';
    mesaj='Artvin\'i iyi tanıyorsun! Şiveni biraz geliştir, bir de semaverin başına geç. Az kaldı tam Artvinli sayılmana!';
    rozetRenk='rgba(61,219,138,.3)';
  } else if(puan<=130){
    rozet='🌟'; unvan='Neredeyse Tam Artvinlisin!';
    mesaj='Artvin\'in sırlarını iyi biliyorsun. Kafkasör\'de seni çay içerken görseler "bu Artvinli" derler! 👏';
    rozetRenk='rgba(240,192,64,.3)';
  } else {
    rozet='🔥'; unvan='Helal! Bildiğin Artvinlisin!';
    mesaj='Tam Artvinli! Hem badyayı bilirsin hem puçukoyu, hem Kafkasör\'ü hem Deriner\'i. Seni Artvin\'e kadar alkışlıyoruz! 🎉';
    rozetRenk='rgba(240,192,64,.4)';
  }

  const rozetEl = document.getElementById('sonucRozet');
  rozetEl.textContent=rozet;
  rozetEl.style.background=rozetRenk;
  rozetEl.style.borderColor=rozetRenk.replace('.3','1').replace('.4','1');

  document.getElementById('sonucUnvan').textContent=unvan;
  document.getElementById('sonucPuan').textContent=puan+'/150';
  document.getElementById('sonucPuan').style.color = puan>=90 ? 'var(--gold)' : puan>=50 ? 'var(--vivid)' : 'var(--off)';
  document.getElementById('sonucMesaj').textContent=mesaj;
  document.getElementById('siDogru').textContent=dogru;
  document.getElementById('siDogru').style.color='var(--vivid)';
  document.getElementById('siYanlis').textContent=(SORULAR.length-dogru);
  document.getElementById('siYanlis').style.color='var(--red)';
  document.getElementById('siYuzde').textContent='%'+yuzde;

  const paylasimTxt = '🏔️ "Ne Kadar Artvinlisin?" quizini çözdüm!\n\n'+
    rozet+' '+unvan+'\n'+
    '📊 Puan: '+puan+'/150 (%'+yuzde+')\n'+
    '✅ Doğru: '+dogru+'/'+SORULAR.length+'\n\n'+
    'Sen de dene 👇\nartvinrehber.com/quiz.html';
  document.getElementById('paylasimMetin').textContent=paylasimTxt;
}

function paylasIG(){
  const m=document.getElementById('paylasimMetin').textContent;
  navigator.clipboard.writeText(m).then(function(){
    alert('Instagram için kopyalandı! Story veya gönderi olarak yapıştır 📸');
  });
}
function kopyala(){
  const m=document.getElementById('paylasimMetin').textContent;
  navigator.clipboard.writeText(m).then(function(){
    alert('Kopyalandı! 📋');
  });
}
function paylasWP(){
  const metin = document.getElementById('paylasimMetni') ?
    document.getElementById('paylasimMetni').textContent :
    document.getElementById('paylasimMetin').textContent;
  window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(metin),'_blank');
}

function paylasX(){
  const metin = document.getElementById('paylasimMetin').textContent;
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(metin),'_blank');
}

function tekrar(){
  document.getElementById('ekranSonuc').style.display='none';
  baslat();
}

function igKopyala(){
  navigator.clipboard.writeText("Ne Kadar Artvinlisin? 🏔️ Test et! artvinrehber.com/quiz.html").then(function(){
    alert("Instagram için kopyalandı! Story'ne yapıştır 📸");
  });
}
function linkKopyala(){
  navigator.clipboard.writeText("https://artvinrehber.com/quiz.html").then(function(){
    alert("Bağlantı kopyalandı! 🔗");
  });
}

</script>
</body>
