<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACU Test</title>
<style>
body{background:#0f0e17;color:#fff;font-family:system-ui;padding:1rem;}
.test{background:#16152a;border-radius:10px;padding:1rem;margin-bottom:.75rem;font-size:.85rem;}
.ok{color:#4ade80;}
.err{color:#f87171;}
button{background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:.75rem 1.5rem;font-size:.9rem;cursor:pointer;width:100%;margin-bottom:.5rem;font-family:system-ui;}
</style>
</head>
<body>
<h2 style="margin-bottom:1rem;">ACU Kampüs Test</h2>

<div class="test" id="t1">⏳ Firebase bağlantısı test ediliyor...</div>
<div class="test" id="t2">⏳ Buton testi...</div>

<button onclick="butonTest()">🔴 Bu butona tıkla</button>
<button onclick="modalTest()">🟡 Modal test</button>

<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#16152a;border-radius:16px;padding:2rem;text-align:center;">
    <div style="font-size:1.5rem;margin-bottom:1rem;">✅ Modal çalışıyor!</div>
    <button onclick="document.getElementById('modal').style.display='none'">Kapat</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
function butonTest(){
  document.getElementById('t2').innerHTML='<span class="ok">✅ Butonlar çalışıyor!</span>';
}

function modalTest(){
  var m=document.getElementById('modal');
  m.style.display='flex';
}

// Firebase test
try {
  firebase.initializeApp({
    apiKey:"AIzaSyBCUemvYsklmdfHqhgq7D5hZwquKDUZVC0",
    authDomain:"acu-kampus.firebaseapp.com",
    projectId:"acu-kampus",
    storageBucket:"acu-kampus.firebasestorage.app",
    messagingSenderId:"356152793085",
    appId:"1:356152793085:web:38a6ae1ad911880cb2ab94"
  });
  var db=firebase.firestore();
  db.collection('acukampus').where('durum','==','aktif').limit(1).get()
    .then(function(snap){
      document.getElementById('t1').innerHTML='<span class="ok">✅ Firebase bağlantısı çalışıyor! ('+snap.size+' döküman)</span>';
    })
    .catch(function(e){
      document.getElementById('t1').innerHTML='<span class="err">❌ Firebase hata: '+e.message+'</span>';
    });
} catch(e) {
  document.getElementById('t1').innerHTML='<span class="err">❌ Firebase init hata: '+e.message+'</span>';
}
</script>
</body>
</html>
