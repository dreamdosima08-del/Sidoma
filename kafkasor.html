<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kafkasör Baş Boğası | artvinrehber.com</title>
<meta name="description" content="Artvin'in efsane boğa güreşi Kafkasör'de şampiyon ol! Boğanı seç, yaylada güçlendir, rakiplerini meydan dışına sür.">
<meta name="geo.region" content="TR-08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:linear-gradient(165deg,#1a3b2e,#2a5e4a,#3a7a5a);font-family:'Nunito',sans-serif;color:#f5e7d3;}
.wrap{max-width:500px;margin:0 auto;padding:16px;}

/* BAŞLIK */
.baslik{text-align:center;padding:20px 0 10px;}
.baslik h1{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:.1em;color:#f5e7d3;text-shadow:3px 3px 0 #1e3a28;}
.baslik .rozet{display:inline-block;background:#a77b4b;padding:4px 18px;border-radius:60px;font-size:.8rem;color:#1d341d;font-weight:900;margin-top:6px;box-shadow:inset 0 -2px 0 #5e3e2e;}

/* KART */
.kart{background:#2b5e42;border-radius:20px;border:2px solid #b89b6e;box-shadow:0 8px 0 #143023,0 12px 24px rgba(0,0,0,.3);padding:20px;margin-bottom:16px;}
.kart-ic{background:#a7d0a0;border-radius:14px;padding:20px;box-shadow:inset 0 2px 8px #5c8a5c,0 4px 0 #3d6e3d;}

/* FORM */
.form-grup{margin-bottom:16px;}
.form-grup label{display:block;font-weight:900;color:#1a3a1a;margin-bottom:6px;font-size:.95rem;}
.form-input{width:100%;padding:.65rem .9rem;border-radius:8px;border:2px solid #4a7e4a;background:#f0ede0;color:#1a3a1a;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;outline:none;transition:.2s;}
.form-input:focus{border-color:#a77b4b;}
.form-select{width:100%;padding:.65rem .9rem;border-radius:8px;border:2px solid #4a7e4a;background:#f0ede0;color:#1a3a1a;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;outline:none;cursor:pointer;}

/* STAT ÖNİZLEME */
.stat-onizleme{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.stat-chip{background:#3d6e3d;border-radius:8px;padding:8px 10px;text-align:center;}
.stat-chip .no{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#f5e7d3;display:block;}
.stat-chip .lbl{font-size:.58rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(245,231,211,.5);}

/* BUTONLAR */
.btn{width:100%;padding:.85rem;border-radius:12px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;letter-spacing:.05em;transition:.15s;margin-top:8px;}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(0);}
.btn-ana{background:linear-gradient(135deg,#e8a030,#c47820);color:#1a3a1a;box-shadow:0 4px 0 #7a4a10,0 6px 16px rgba(0,0,0,.3);}
.btn-ikinci{background:rgba(255,255,255,.15);color:#f5e7d3;border:2px solid rgba(255,255,255,.2);}

/* OYUN EKRANI */
.oyun-ust{display:flex;gap:8px;margin-bottom:12px;}
.ust-blok{flex:1;background:#1e3a1e;border-radius:10px;padding:8px 6px;text-align:center;border:1px solid rgba(255,255,255,.1);}
.ust-blok .no{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:#f5e7d3;display:block;line-height:1;}
.ust-blok .lbl{font-size:.5rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(245,231,211,.4);}

/* İLERLEME */
.ilerleme{background:rgba(0,0,0,.2);border-radius:20px;height:10px;margin-bottom:16px;overflow:hidden;}
.ilerleme-ic{height:100%;background:linear-gradient(90deg,#e8a030,#f0c040);border-radius:20px;transition:width .4s ease;}

/* OLAY KARTI */
.olay-kart{background:#3d6e3d;border-radius:14px;padding:18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.1);}
.olay-baslik{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.08em;color:#f5e7d3;margin-bottom:6px;}
.olay-aciklama{font-size:.88rem;color:rgba(245,231,211,.7);line-height:1.5;margin-bottom:14px;}

.secenekler{display:flex;flex-direction:column;gap:8px;}
.secenek{padding:.75rem 1rem;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#f5e7d3;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:.15s;text-align:left;}
.secenek:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);transform:translateX(4px);}

/* GÜREŞ */
.gures-alani{background:linear-gradient(135deg,#1e4a1e,#2a6a2a);border-radius:14px;padding:20px;border:2px solid #e8a030;margin-bottom:12px;text-align:center;}
.gures-baslik{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.1em;color:#f0c040;margin-bottom:4px;}
.gures-rakip{font-size:.85rem;color:rgba(245,231,211,.7);margin-bottom:16px;}
.hamle-row{display:flex;gap:8px;}
.hamle-btn{flex:1;padding:.8rem .5rem;border-radius:10px;border:2px solid #e8a030;background:rgba(232,160,48,.15);color:#f5e7d3;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;cursor:pointer;transition:.15s;text-align:center;}
.hamle-btn:hover{background:rgba(232,160,48,.35);transform:translateY(-2px);}

/* SONUÇ */
.sonuc-kart{background:#1e4a1e;border-radius:14px;padding:24px;text-align:center;border:2px solid #f0c040;margin-bottom:12px;}
.sonuc-emoji{font-size:3rem;margin-bottom:8px;}
.sonuc-mesaj{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.08em;color:#f5e7d3;line-height:1.3;margin-bottom:12px;}
.sonuc-puan{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:#f0c040;display:block;}
.sonuc-puan-lbl{font-size:.6rem;color:rgba(245,231,211,.5);letter-spacing:.1em;text-transform:uppercase;}

/* SKOR LİSTESİ */
.skor-liste{list-style:none;margin-top:12px;}
.skor-liste li{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border-radius:8px;margin-bottom:4px;background:rgba(255,255,255,.06);font-size:.85rem;font-weight:700;}
.skor-liste li:first-child{background:rgba(240,192,64,.15);color:#f0c040;}
.skor-sira{font-family:'Bebas Neue',sans-serif;font-size:1rem;min-width:1.5rem;text-align:center;color:rgba(245,231,211,.4);}

/* GİZLE */
.gizle{display:none;}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;background:rgba(20,48,35,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(184,155,110,.3);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:.8rem;letter-spacing:.14em;color:#f0c040;text-decoration:none;}
.nav-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.1em;color:#f5e7d3;}
.nav-back{font-size:.65rem;color:rgba(245,231,211,.5);border:1px solid rgba(245,231,211,.2);padding:.25rem .65rem;border-radius:4px;text-decoration:none;transition:.15s;}
.nav-back:hover{color:#f0c040;border-color:#f0c040;}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">ARTVİN REHBERİ</a>
  <div class="nav-title">🐂 KAFKASÖR</div>
  <a class="nav-back" href="/">← Geri</a>
</nav>

<div class="wrap">

  <!-- ═══ BAŞLANGIÇ MENÜSÜ ═══ -->
  <div id="menuEkran">
    <div class="baslik">
      <h1>🐂 KAFKASÖR<br>BAŞ BOĞASI</h1>
      <span class="rozet">Artvin Yaylası Şampiyonası</span>
    </div>

    <div class="kart">
      <div class="kart-ic">
        <div class="form-grup">
          <label>Sahibinin Adı</label>
          <input class="form-input" id="kullaniciAdi" type="text" placeholder="Adınızı girin..." maxlength="20">
        </div>
        <div class="form-grup">
          <label>Boğanın Adı</label>
          <input class="form-input" id="bogaAdi" type="text" placeholder="Boğanın adı..." maxlength="20">
        </div>
        <div class="form-grup">
          <label>Irk Seç</label>
          <select class="form-select" id="irkSec" onchange="irkGuncelle()">
            <option value="boz">🐂 Boz Irk — Dengeli</option>
            <option value="kara">⚫ Yerli Kara — Güçlü</option>
            <option value="kafkas">🏔️ Kafkas Irk — Dayanıklı</option>
          </select>
        </div>
        <div class="stat-onizleme" id="statOnizleme"></div>
        <button class="btn btn-ana" id="baslaBtn">🏁 YAYLAYA ÇIK</button>
        <button class="btn btn-ikinci" id="skorBtn">🏅 Sıralama Tablosu</button>
      </div>
    </div>

    <div class="kart gizle" id="skorPanel">
      <div class="kart-ic">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.1em;color:#1a3a1a;margin-bottom:8px">🏆 EN İYİ 5</div>
        <ul class="skor-liste" id="skorListe"></ul>
      </div>
    </div>
  </div>

  <!-- ═══ OYUN EKRANI ═══ -->
  <div id="oyunEkran" class="gizle">
    <div class="oyun-ust" id="statBar"></div>
    <div class="ilerleme"><div class="ilerleme-ic" id="ilerlemeDolgu" style="width:0%"></div></div>
    <div id="olayAlani"></div>
  </div>

  <!-- ═══ SONUÇ EKRANI ═══ -->
  <div id="sonucEkran" class="gizle">
    <div class="sonuc-kart">
      <div class="sonuc-emoji" id="sonucEmoji">🏆</div>
      <div class="sonuc-mesaj" id="sonucMesaj"></div>
      <span class="sonuc-puan" id="sonucPuan">0</span>
      <span class="sonuc-puan-lbl">Toplam Puan</span>
    </div>
    <div class="kart">
      <div class="kart-ic">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.1em;color:#1a3a1a;margin-bottom:8px">🏆 SKOR TABLOSU</div>
        <ul class="skor-liste" id="sonucSkorListe"></ul>
      </div>
    </div>
    <button class="btn btn-ana" id="tekrarBtn">🔄 YENİDEN OYNA</button>
    <a href="/" style="display:block;text-align:center;font-size:.75rem;color:rgba(245,231,211,.5);margin-top:12px;text-decoration:none">← Ana Sayfaya Dön</a>
  </div>

</div>

<script>
/* ═══ IRK VERİSİ ═══ */
var IRKLAR = {
  boz:   { ad:'Boz Irk',     guc:7, kond:7, moral:6, agir:7 },
  kara:  { ad:'Yerli Kara',  guc:9, kond:6, moral:5, agir:8 },
  kafkas:{ ad:'Kafkas Irk',  guc:6, kond:9, moral:7, agir:6 }
};

var YAYLALAR = ['Kafkasör','Sahara','Arsiyani','Veliköy','Dişhor','Bilbilan','Kafkasör Yaylası','Papart'];
var YEMLER   = ['Arpa','Yulaf','Mısır','Kuru Ot','Çayır Otu','Kepek'];
var RAKIPLER = ['Bozkurt','Demir','Yıldırım','Karakafa','Dağ Aslanı','Demirbaş','Karabaş','Şimşek'];
var KATEGORILER = ['Küçük Baş','Orta Baş','Büyük Baş','Baş Boğa'];

/* ═══ OYUN DURUMU ═══ */
var durum = {};
var skorlar = [];

/* ═══ BAŞLANGIÇ ═══ */
function irkGuncelle() {
  var irk = IRKLAR[document.getElementById('irkSec').value];
  var el = document.getElementById('statOnizleme');
  el.innerHTML =
    '<div class="stat-chip"><span class="no">'+irk.guc+'</span><span class="lbl">💪 Güç</span></div>' +
    '<div class="stat-chip"><span class="no">'+irk.kond+'</span><span class="lbl">🏃 Kondisyon</span></div>' +
    '<div class="stat-chip"><span class="no">'+irk.moral+'</span><span class="lbl">🔥 Moral</span></div>' +
    '<div class="stat-chip"><span class="no">'+irk.agir+'</span><span class="lbl">⚖️ Ağırlık</span></div>';
}

function skorYukle() {
  try { skorlar = JSON.parse(localStorage.getItem('kafkasor_skorlar')) || []; } catch(e) { skorlar = []; }
  if (!skorlar.length) {
    skorlar = [{kullanici:'Şavşatlı Ali',boga:'Karabaş',puan:95},{kullanici:'Macahelli Dede',boga:'Yıldırım',puan:78},{kullanici:'Borçkalı Hüseyin',boga:'Demir',puan:62}];
    localStorage.setItem('kafkasor_skorlar', JSON.stringify(skorlar));
  }
}

function skorKaydet(kullanici, boga, puan) {
  skorlar.push({kullanici:kullanici, boga:boga, puan:puan});
  skorlar.sort(function(a,b){return b.puan-a.puan;});
  skorlar = skorlar.slice(0,10);
  localStorage.setItem('kafkasor_skorlar', JSON.stringify(skorlar));
}

function skorRender(listeId) {
  var el = document.getElementById(listeId);
  var medalya = ['🥇','🥈','🥉'];
  el.innerHTML = '';
  skorlar.slice(0,5).forEach(function(s,i) {
    var li = document.createElement('li');
    li.innerHTML = '<span class="skor-sira">'+(medalya[i]||(i+1)+'.')+'</span> '+s.kullanici+' — '+s.boga+' — <strong>'+s.puan+' puan</strong>';
    el.appendChild(li);
  });
}

function statGuncelle() {
  document.getElementById('statBar').innerHTML =
    '<div class="ust-blok"><span class="no">'+durum.guc+'</span><span class="lbl">💪 Güç</span></div>' +
    '<div class="ust-blok"><span class="no">'+durum.kond+'</span><span class="lbl">🏃 Kond</span></div>' +
    '<div class="ust-blok"><span class="no">'+durum.moral+'</span><span class="lbl">🔥 Moral</span></div>' +
    '<div class="ust-blok"><span class="no">'+durum.puan+'</span><span class="lbl">⭐ Puan</span></div>';
}

function ilerlemeGuncelle() {
  var toplam = YAYLALAR.length + KATEGORILER.length;
  var tamamlanan = durum.hazirlikAdimi + durum.guresAdimi;
  var yuzde = Math.round((tamamlanan / toplam) * 100);
  document.getElementById('ilerlemeDolgu').style.width = yuzde + '%';
}

/* ═══ OYUN BAŞLAT ═══ */
document.getElementById('baslaBtn').onclick = function() {
  var kullanici = document.getElementById('kullaniciAdi').value.trim() || 'Artvinli Yiğit';
  var boga = document.getElementById('bogaAdi').value.trim() || 'Bozkurt';
  var irkKey = document.getElementById('irkSec').value;
  var irk = IRKLAR[irkKey];

  durum = {
    kullanici: kullanici,
    boga: boga,
    irkAd: irk.ad,
    guc: irk.guc,
    kond: irk.kond,
    moral: irk.moral,
    agir: irk.agir,
    puan: 0,
    hazirlikAdimi: 0,
    guresAdimi: 0
  };

  document.getElementById('menuEkran').classList.add('gizle');
  document.getElementById('oyunEkran').classList.remove('gizle');
  document.getElementById('sonucEkran').classList.add('gizle');

  statGuncelle();
  ilerlemeGuncelle();
  sonrakiOlay();
};

document.getElementById('skorBtn').onclick = function() {
  var panel = document.getElementById('skorPanel');
  panel.classList.toggle('gizle');
  if (!panel.classList.contains('gizle')) {
    skorRender('skorListe');
  }
};

/* ═══ HAZIRLIK OLAYLARI ═══ */
function rastgeleOlay() {
  var r = Math.floor(Math.random() * 5);
  var yayla = YAYLALAR[Math.floor(Math.random()*YAYLALAR.length)];
  var yem = YEMLER[Math.floor(Math.random()*YEMLER.length)];

  var olaylar = [
    {
      baslik: '🏔️ ' + yayla + '\'da Otlatma',
      aciklama: 'Hava serin, otlar gür. Boğan için ne yapıyorsun?',
      a: {metin:'🍀 Bol bol otlat', guc:1, kond:-1, moral:1, agir:1},
      b: {metin:'💪 Rampa çıkart', guc:2, kond:1, moral:-1, agir:0}
    },
    {
      baslik: '🌾 Yem Zamanı',
      aciklama: yem + ' mı verelim, dinlendirelim mi?',
      a: {metin:'✅ ' + yem + ' ver', guc:1, kond:1, moral:0, agir:1},
      b: {metin:'😴 Dinlendir', guc:0, kond:2, moral:2, agir:0}
    },
    {
      baslik: '🏥 Boğa Biraz Halsiz',
      aciklama: 'Ne yapıyoruz?',
      a: {metin:'🔮 Ocağa okut', guc:0, kond:0, moral:3, agir:-1},
      b: {metin:'🩺 Kırıkçı\'ya götür', guc:1, kond:2, moral:0, agir:0}
    },
    {
      baslik: '🏋️ Antrenman Günü',
      aciklama: 'Nasıl çalıştıralım?',
      a: {metin:'🎵 Tulumla güreştir', guc:3, kond:-1, moral:2, agir:0},
      b: {metin:'🏃 Koştur', guc:1, kond:3, moral:-1, agir:-1}
    },
    {
      baslik: '😤 Boğa Keyifsiz',
      aciklama: 'Ne yapsak coşar?',
      a: {metin:'📣 Bağırt', guc:1, kond:0, moral:3, agir:0},
      b: {metin:'🌿 Serbest bırak', guc:-1, kond:1, moral:2, agir:1}
    }
  ];
  return olaylar[r % olaylar.length];
}

function statUygula(degisim) {
  durum.guc   = Math.max(1, Math.min(15, durum.guc   + (degisim.guc  || 0)));
  durum.kond  = Math.max(1, Math.min(15, durum.kond  + (degisim.kond || 0)));
  durum.moral = Math.max(1, Math.min(15, durum.moral + (degisim.moral|| 0)));
  durum.agir  = Math.max(1, Math.min(15, durum.agir  + (degisim.agir || 0)));
  statGuncelle();
  ilerlemeGuncelle();
}

function sonrakiOlay() {
  if (durum.hazirlikAdimi < YAYLALAR.length) {
    var olay = rastgeleOlay();
    durum.hazirlikAdimi++;

    var el = document.getElementById('olayAlani');
    el.innerHTML =
      '<div class="olay-kart">' +
        '<div class="olay-baslik">' + olay.baslik + '</div>' +
        '<div class="olay-aciklama">' + olay.aciklama + '</div>' +
        '<div class="secenekler">' +
          '<button class="secenek" id="secA">🐂 ' + olay.a.metin + '</button>' +
          '<button class="secenek" id="secB">🌲 ' + olay.b.metin + '</button>' +
        '</div>' +
      '</div>' +
      '<div style="text-align:center;font-size:.75rem;color:rgba(245,231,211,.4)">Hazırlık ' + durum.hazirlikAdimi + ' / ' + YAYLALAR.length + '</div>';

    document.getElementById('secA').onclick = function() {
      statUygula(olay.a);
      sonrakiOlay();
    };
    document.getElementById('secB').onclick = function() {
      statUygula(olay.b);
      sonrakiOlay();
    };
  } else {
    guresBaslat();
  }
}

/* ═══ GÜREŞ ═══ */
function guresBaslat() {
  sonrakiGures();
}

function sonrakiGures() {
  if (durum.guresAdimi >= KATEGORILER.length) {
    oyunBitis();
    return;
  }

  var kategori = KATEGORILER[durum.guresAdimi];
  var rakip = RAKIPLER[Math.floor(Math.random() * RAKIPLER.length)];

  var hamleler = [
    [{metin:'⚡ Hızlı Hamle', puan:15, kond:-1, moral:1}, {metin:'💪 Güç Hamlesi', puan:22, kond:-3, moral:-1}],
    [{metin:'🔄 Savuştur', puan:10, kond:-1, moral:2},    {metin:'🎯 Rakibi Sür',  puan:18, kond:-2, moral:0}],
    [{metin:'🛡️ Savun',    puan:8,  kond:0,  moral:1},    {metin:'🐂 Hücum',       puan:24, kond:-3, moral:2}]
  ];
  var h = hamleler[Math.floor(Math.random() * hamleler.length)];

  var el = document.getElementById('olayAlani');
  el.innerHTML =
    '<div class="gures-alani">' +
      '<div class="gures-baslik">🏟️ ' + kategori + '</div>' +
      '<div class="gures-rakip">Rakip: <strong>' + rakip + '</strong> — ' + durum.boga + ' meydan okuyor!</div>' +
      '<div class="hamle-row">' +
        '<button class="hamle-btn" id="hamleA">' + h[0].metin + '</button>' +
        '<button class="hamle-btn" id="hamleB">' + h[1].metin + '</button>' +
      '</div>' +
    '</div>' +
    '<div style="text-align:center;font-size:.75rem;color:rgba(245,231,211,.4)">Kategori ' + (durum.guresAdimi+1) + ' / ' + KATEGORILER.length + '</div>';

  document.getElementById('hamleA').onclick = function() { guresSonuc(h[0], rakip, kategori); };
  document.getElementById('hamleB').onclick = function() { guresSonuc(h[1], rakip, kategori); };
}

function guresSonuc(hamle, rakip, kategori) {
  var basari = durum.guc + durum.kond + durum.moral + Math.floor(Math.random() * 6);
  var rakipGuc = 12 + Math.floor(Math.random() * 12);
  var kazandi = basari > rakipGuc;
  var puan = kazandi ? hamle.puan : Math.floor(hamle.puan * 0.3);

  durum.puan += puan;
  durum.kond  = Math.max(1, durum.kond  + hamle.kond);
  durum.moral = Math.max(1, Math.min(15, durum.moral + hamle.moral));
  durum.guresAdimi++;
  statGuncelle();
  ilerlemeGuncelle();

  var el = document.getElementById('olayAlani');
  el.innerHTML =
    '<div class="olay-kart" style="text-align:center">' +
      '<div class="olay-baslik">' + (kazandi ? '🏆 KAZANDI!' : '😔 Bu Sefer Olmadı') + '</div>' +
      '<div class="olay-aciklama">' +
        durum.boga + (kazandi ? ' rakibini meydan dışına sürdü!' : ' bu sefer yenildi ama mücadeleci ruhunu kaybetmedi.') +
        '<br><strong style="color:#f0c040">+' + puan + ' puan</strong>' +
      '</div>' +
      '<div class="secenekler">' +
        '<button class="secenek" id="devamBtn">➡️ ' + (durum.guresAdimi < KATEGORILER.length ? 'Sonraki Kategori' : 'Sonucu Gör') + '</button>' +
      '</div>' +
    '</div>';

  document.getElementById('devamBtn').onclick = sonrakiGures;
}

/* ═══ OYUN BİTİŞ ═══ */
function oyunBitis() {
  var puan = durum.puan;
  var emoji, mesaj;

  if (puan >= 90) {
    emoji = '🏆';
    mesaj = durum.boga + ' Kafkasör\'ün efsane şampiyonu oldu! ' + durum.kullanici + ' adı yaylalarda yankılandı!';
  } else if (puan >= 60) {
    emoji = '🥈';
    mesaj = 'Güzel bir performans! ' + durum.boga + ' adını duyurdu. ' + durum.kullanici + ' gurur duyabilir.';
  } else if (puan >= 35) {
    emoji = '💪';
    mesaj = durum.boga + ' deneyim kazandı. Seneye Kafkasör\'e daha güçlü gelecek!';
  } else {
    emoji = '🤝';
    mesaj = durum.boga + ' bu yıl zorlandı ama mücadele etmekten vazgeçmedi.';
  }

  skorKaydet(durum.kullanici, durum.boga, puan);
  skorRender('sonucSkorListe');

  document.getElementById('oyunEkran').classList.add('gizle');
  document.getElementById('sonucEkran').classList.remove('gizle');
  document.getElementById('sonucEmoji').textContent = emoji;
  document.getElementById('sonucMesaj').textContent = mesaj;
  document.getElementById('sonucPuan').textContent = puan;
}

/* ═══ TEKRAR OYNA ═══ */
document.getElementById('tekrarBtn').onclick = function() {
  document.getElementById('sonucEkran').classList.add('gizle');
  document.getElementById('menuEkran').classList.remove('gizle');
};

/* ═══ BAŞLAT ═══ */
skorYukle();
irkGuncelle();
</script>
