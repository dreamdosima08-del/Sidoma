:root{--bg:#0a1630;--yuzey:#13213f;--cizgi:rgba(236,244,239,.13);--yazi:#ecf4ef;--dim:rgba(236,244,239,.6);--amber:#f0b84a;--buz:#bfe6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--yazi);font-family:'Bricolage',system-ui,sans-serif;min-height:100vh;padding:20px 16px 48px}
.w{max-width:440px;margin:0 auto}
.bas{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bas svg{width:44px;height:44px;flex:none}
.bas h1{font-size:1.2rem;font-weight:700;line-height:1.15}
.bas p{font-size:.82rem;color:var(--dim)}
.onizleme{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:9/16;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.onizleme canvas{display:block;width:100%;height:100%}
.yuk{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-weight:600;background:var(--bg)}
.btnlar{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:14px}
.btn{font:inherit;font-weight:700;font-size:1rem;padding:15px;border-radius:14px;border:0;cursor:pointer;background:var(--amber);color:#1d1404}
.btn.iki{background:transparent;color:var(--yazi);border:1px solid var(--cizgi)}
.alan{margin-top:18px;padding-top:16px;border-top:1px solid var(--cizgi)}
.alan>label,.alan>span{display:block;font-size:.85rem;font-weight:700;margin-bottom:8px}
.alan input[type=text]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--cizgi);background:var(--yuzey);color:#fff;font:inherit;font-size:1rem}
.alan small{display:block;font-size:.78rem;color:var(--dim);margin-top:7px;line-height:1.5}
.alan small a{color:var(--buz)}
.secim{display:flex;flex-wrap:wrap;gap:8px}
.secim label,.secim button{display:inline-flex;align-items:center;gap:7px;font:inherit;font-weight:600;font-size:.85rem;padding:8px 13px;border-radius:999px;border:1px solid var(--cizgi);background:transparent;color:var(--yazi);cursor:pointer}
.secim input{accent-color:var(--amber)}
.secim button.on{background:var(--yazi);color:var(--bg)}
.veri{font-size:.8rem;color:var(--dim);line-height:1.55;background:var(--yuzey);border-radius:12px;padding:12px 14px}
.veri b{color:var(--yazi);font-weight:600}

<div class="w">
  <div class="bas">

<script>
(function(){
'use strict';
var W=1080,H=1920,M=88, cv=document.getElementById('cv'), x=cv.getContext('2d');
function $(i){return document.getElementById(i);}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function p2(n){return String(n).padStart(2,'0');}
function gs(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function trs(n){return Math.round(n).toLocaleString('tr-TR');}
var AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var GUN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
var bugun=new Date(), dun=new Date(); dun.setDate(dun.getDate()-1);
var BUGUN=gs(bugun);
var V={hava:null,kar:null,t850:null,nabiz:null,dogus:null,yuzde:null,yIlk:null}, FOTO=null, fotoSecildi=false, GOSTER={hava:true,kar:true,eczane:true,nabiz:true};
var MERKEZ_RAKIM=550;
var YERLER=[{ad:'Merkez',a:550,b:550},{ad:'Katrevan',a:800,b:800},{ad:'Kafkasör',a:1250,b:1400},{ad:'Mersivan',a:1800,b:1900}];
var FOTO_ODAK={'story-arka-merkez.jpg':.6,'ilce-foto-merkez.jpg':.74,'kis-merkez-panorama.jpg':.5}; // şehrin fotoğraftaki dikey yeri

/* ═════════ HAVA: üç modelin ortak görüşü ═════════
   ECMWF, ICON ve GFS ayrı ayrı alınır. Yağış ancak en az iki model
   gündüz saatlerinde (07–22) ≥1 mm verirse "bekleniyor" denir.
   Sıcaklıklar modellerin ortancasıdır. Tek model yağış veriyorsa
   "ihtimal düşük" denir, kesin konuşulmaz. */
var MODELLER=['ecmwf_ifs025','icon_seamless','gfs_seamless'], MAD={ecmwf_ifs025:'ECMWF',icon_seamless:'ICON',gfs_seamless:'GFS'};
function ortanca(a){ a=a.filter(function(v){return v!=null&&isFinite(v);}).sort(function(p,q){return p-q;}); if(!a.length) return null; var m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2; }
function dilim(h){ return h<11?'sabah':h<14?'öğle saatlerinde':h<18?'öğleden sonra':'akşam'; }
function havaHesap(d,fl){
  var h=d.hourly, saat=h.time, gunIdx=[], gunduz=[];
  saat.forEach(function(t,i){ if(t.slice(0,10)===BUGUN){ gunIdx.push(i); var s=+t.slice(11,13); if(s>=7&&s<=22) gunduz.push(i); } });
  if(!gunIdx.length) return null;
  var mods=MODELLER.filter(function(m){ return h['temperature_2m_'+m]&&h['precipitation_'+m]; });
  if(mods.length<2) return null;
  var mx=[],mn=[],yagisli=0,toplam=[],ilkSaat=[],karSaat=0;
  mods.forEach(function(m){
    var T=h['temperature_2m_'+m], P=h['precipitation_'+m], S=h['snowfall_'+m]||[];
    var tt=gunIdx.map(function(i){return T[i];}).filter(function(v){return v!=null;});
    if(!tt.length) return;
    mx.push(Math.max.apply(null,tt)); mn.push(Math.min.apply(null,tt));
    var top=0, ilk=null; gunduz.forEach(function(i){ var p=P[i]||0; top+=p; if(ilk==null&&p>=0.3) ilk=+saat[i].slice(11,13); if((S[i]||0)>0) karSaat++; });
    toplam.push(top); if(top>=1){ yagisli++; if(ilk!=null) ilkSaat.push(ilk); }
  });
  if(!mx.length) return null;
  var r={mx:Math.round(ortanca(mx)), mn:Math.round(ortanca(mn)), modeller:mods.map(function(m){return MAD[m];}), yagisli:yagisli, n:mods.length, mm:ortanca(toplam)};
  // merkezde (550 m) kar ancak kar seviyesi merkeze inerse ya da modeller kar gösterirse
  var karMerkez=(fl!=null&&fl<=MERKEZ_RAKIM)||karSaat>=2*mods.length;
  var tur=karMerkez?'kar':'yağmur';
  var bulut=ortanca(mods.map(function(m){ var C=h['cloud_cover_'+m]||[]; return ortanca(gunduz.map(function(i){return C[i];})); })); if(bulut==null) bulut=50;
  var p=V.yuzde, seviye;
  if(p!=null) seviye=p>=60?3:p>=40?2:p>=20?1:0; else seviye=yagisli>=2?3:yagisli===1?1:0;
  var ilk=V.yIlk!=null?V.yIlk:(ilkSaat.length?Math.round(ortanca(ilkSaat)):null), d0=ilk!=null?dilim(ilk):'gün içinde', D0=d0.charAt(0).toUpperCase()+d0.slice(1);
  if(seviye===3){ r.durum=tur==='kar'?'kar':'yagmur'; r.baslik=(tur==='kar'?'Kar':'Yağmur')+' ihtimali yüksek'; r.metin=D0+' '+tur+' ihtimali yüksek görünüyor'+(r.mm>=10?', zaman zaman kuvvetli olabilir':'')+'.'; }
  else if(seviye===2){ r.durum=tur==='kar'?'kar':'yagmur'; r.baslik=(tur==='kar'?'Kar':'Yağmur')+' ihtimali var'; r.metin=D0+' yer yer '+tur+' ihtimali var.'; }
  else if(seviye===1){ r.durum=bulut<60?'parcali':'bulut'; r.baslik=bulut<60?'Parçalı bulutlu':'Bulutlu bir gün'; r.metin='Hafif '+tur+' ihtimali düşük görünüyor.'; }
  else { r.durum=bulut<30?'gunes':bulut<70?'parcali':'bulut'; r.baslik=bulut<30?'Güneşli bir gün':bulut<70?'Parçalı bulutlu':'Bulutlu, yağışsız'; r.metin='Gün boyu yağış görünmüyor.'; }
  if(r.mn<=2) r.metin+=' Sabah ayaz olabilir, sıkı giyinmekte fayda var.';
  else if(r.mn<=9) r.metin+=' Sabah ve akşam serin.';
  else if(r.mx>=30) r.metin+=' Öğle saatleri sıcak geçebilir.';
  return r;
}
var BASE='https://api.open-meteo.com/v1/forecast?latitude=41.1828&longitude=41.8183&timezone=Europe%2FIstanbul&forecast_days=2';
var flP=fetch(BASE+'&hourly=freezing_level_height,temperature_850hPa,precipitation_probability&current=temperature_2m&daily=sunrise').then(function(r){return r.json();}).then(function(d){
  if(!d||!d.hourly||!d.current) return;
  var fl=d.hourly.freezing_level_height, t8=d.hourly.temperature_850hPa||[], i0=Math.max(0,d.hourly.time.indexOf(d.current.time.slice(0,13)+':00')), mf=Infinity, m8=Infinity;
  for(var i=i0;i<Math.min(fl.length,i0+24);i++){ if(fl[i]!=null&&fl[i]<mf) mf=fl[i]; if(t8[i]!=null&&t8[i]<m8) m8=t8[i]; }
  if(isFinite(mf)) V.kar=Math.max(0,Math.round((mf-300)/50)*50);
  if(isFinite(m8)) V.t850=Math.round(m8);
  if(d.daily&&d.daily.sunrise&&d.daily.sunrise[1]) V.dogus=d.daily.sunrise[1].slice(11,16);
  var pp=d.hourly.precipitation_probability||[], pm=null, pIlk=null;
  d.hourly.time.forEach(function(t,i){ var hh=+t.slice(11,13); if(t.slice(0,10)===BUGUN&&hh>=7&&hh<=22&&pp[i]!=null){ if(pm==null||pp[i]>pm) pm=pp[i]; if(pIlk==null&&pp[i]>=40) pIlk=hh; } });
  if(pm!=null){ V.yuzde=Math.round(pm/5)*5; V.yIlk=pIlk; }
}).catch(function(){});
var modP=fetch(BASE+'&hourly=temperature_2m,precipitation,snowfall,cloud_cover&models='+MODELLER.join(',')).then(function(r){return r.json();}).catch(function(){return null;});
var havaP=Promise.all([flP,modP]).then(function(a){ var d=a[1]; if(d&&d.hourly) V.hava=havaHesap(d,V.kar); });

/* ═════════ NABIZ: dünün sonucu ═════════ */
var NURL='https://firestore.googleapis.com/v1/projects/artvin-imece/databases/(default)/documents/nabiz/'+gs(dun)+':runAggregationQuery?key=AIzaSyDPPh1T_PLdfbuQdYbP-HXrnc3a5Nb1nzI';
function say(m){ return fetch(NURL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({structuredAggregationQuery:{structuredQuery:{from:[{collectionId:'oy'}],where:{fieldFilter:{field:{fieldPath:'m'},op:'EQUAL',value:{integerValue:String(m)}}}},aggregations:[{alias:'n',count:{}}]}})})
  .then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(a){ var v=a&&a[0]&&a[0].result&&a[0].result.aggregateFields&&a[0].result.aggregateFields.n; return v?+v.integerValue:0; }); }
var nabizP=Promise.all([say(1),say(2),say(3),say(4)]).then(function(r){ V.nabiz={1:r[0],2:r[1],3:r[2],4:r[3]}; }).catch(function(){});

function foto(src){ return new Promise(function(ok){ var im=new Image(); im.onload=function(){ok(im);}; im.onerror=function(){ok(null);}; im.src=src; }); }

/* ═════════ ÇİZİM ═════════ */
var AMBER='#f0b84a', BUZ='#bfe6ff', BEYAZ='#f4f8f5', DIM='rgba(244,248,245,.68)', SOLUK='rgba(244,248,245,.45)';
function f(w,px,ls){ x.font=w+' '+px+'px Bricolage, system-ui, sans-serif'; x.letterSpacing=(ls||0)+'px'; }
function yaz(t,X,Y,renk,hiza){ x.fillStyle=renk||BEYAZ; x.textAlign=hiza||'left'; x.fillText(t,X,Y); }
function sar(t,mw){ var k=t.split(' '),s=[],a=''; k.forEach(function(w){ var d=a?a+' '+w:w; if(x.measureText(d).width>mw&&a){s.push(a);a=w;} else a=d; }); if(a) s.push(a); return s; }
function cizgi(x1,y1,x2,y2,renk,k){ x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.strokeStyle=renk; x.lineWidth=k||2; x.stroke(); }
function kutu(X,Y,w,h,r){ x.beginPath(); if(x.roundRect) x.roundRect(X,Y,w,h,r); else x.rect(X,Y,w,h); }

function logo(X,Y,px){ // "Artvinrehber": A harfi dağ zirvesi, kesme çizgisi Çoruh
  var cap=px*.72, aw=cap*.98, lw=px*.135;
  x.save(); x.lineCap='round'; x.lineJoin='round';
  x.beginPath(); x.moveTo(X+lw/2,Y); x.lineTo(X+aw/2,Y-cap); x.lineTo(X+aw-lw/2,Y); x.strokeStyle=AMBER; x.lineWidth=lw; x.stroke();
  x.beginPath(); x.moveTo(X+aw/2-cap*.17,Y-cap*.66); x.lineTo(X+aw/2,Y-cap-lw*.2); x.lineTo(X+aw/2+cap*.17,Y-cap*.66); x.lineTo(X+aw/2,Y-cap*.76); x.closePath(); x.fillStyle=BEYAZ; x.fill();
  var wy=Y-cap*.34; x.beginPath(); x.moveTo(X+aw*.16,wy); x.bezierCurveTo(X+aw*.34,wy-cap*.12,X+aw*.5,wy+cap*.12,X+aw*.66,wy); x.bezierCurveTo(X+aw*.76,wy-cap*.07,X+aw*.84,wy-cap*.05,X+aw*.9,wy-cap*.01); x.strokeStyle=BUZ; x.lineWidth=lw*.6; x.stroke();
  f(700,px,-.5); x.textAlign='left'; x.fillStyle=BEYAZ; x.fillText('rtvin',X+aw+px*.04,Y);
  var tw=x.measureText('rtvin').width; f(400,px,-.5); x.fillStyle='rgba(244,248,245,.72)'; x.fillText('rehber',X+aw+px*.04+tw,Y);
  x.restore();
}
function havaIkon(tur,X,Y,s){
  x.save(); x.translate(X,Y); x.scale(s/100,s/100); x.lineCap='round'; x.lineJoin='round'; x.strokeStyle=BEYAZ; x.lineWidth=6;
  function gunes(cx,cy,r,yari){ x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.stroke(); for(var i=0;i<8;i++){ var a=i*Math.PI/4; if(yari&&a>0.2&&a<2.9) continue; cizgi(cx+Math.cos(a)*(r+10),cy+Math.sin(a)*(r+10),cx+Math.cos(a)*(r+18),cy+Math.sin(a)*(r+18),AMBER,6); } }
  function bulut(ox,oy,dolgu){ x.beginPath(); x.moveTo(ox+20,oy+66); x.arc(ox+28,oy+52,15,Math.PI*.55,Math.PI*1.45); x.arc(ox+52,oy+40,22,Math.PI*1.12,Math.PI*1.92); x.arc(ox+74,oy+54,13,Math.PI*1.45,Math.PI*.5); x.closePath(); if(dolgu){ x.fillStyle=dolgu; x.fill(); } x.stroke(); }
  if(tur==='gunes'){ x.strokeStyle=AMBER; gunes(50,50,20); }
  else if(tur==='parcali'){ x.strokeStyle=AMBER; gunes(34,32,14,true); x.strokeStyle=BEYAZ; bulut(12,26,'rgba(12,26,56,1)'); }
  else { bulut(0,6);
    if(tur==='yagmur') [32,52,72].forEach(function(c){ cizgi(c,84,c-7,100,BUZ,6); });
    if(tur==='kar') [32,52,72].forEach(function(c){ x.beginPath(); x.arc(c,92,4.5,0,Math.PI*2); x.fillStyle=BUZ; x.fill(); }); }
  x.restore();
}
function eczIkon(X,Y){ x.save(); x.translate(X,Y); x.strokeStyle=AMBER; x.lineWidth=5; x.lineCap='round'; kutu(0,0,52,52,15); x.stroke(); cizgi(26,15,26,37,AMBER,6); cizgi(15,26,37,26,AMBER,6); x.restore(); }
function nabizIkon(X,Y){ x.save(); x.translate(X,Y); x.strokeStyle=AMBER; x.lineWidth=5; x.lineCap='round'; x.lineJoin='round';
  x.beginPath(); x.moveTo(0,26); x.lineTo(12,26); x.lineTo(19,8); x.lineTo(29,44); x.lineTo(37,18); x.lineTo(42,26); x.lineTo(54,26); x.stroke(); x.restore(); }

function ciz(){
  x.save(); x.clearRect(0,0,W,H); x.textBaseline='alphabetic';
  // zemin: fotoğraf üst %80'e oturur, altı koyu zemine erir
  x.fillStyle='#0a1630'; x.fillRect(0,0,W,H);
  if(FOTO){ var s=Math.max(W/FOTO.width,1180/FOTO.height), fw=FOTO.width*s, fh=FOTO.height*s, odak=FOTO_ODAK[FOTO.src.split('/').pop()]||.5;
    var dy=Math.min(0,Math.max(1000-fh,470-odak*fh));
    x.filter='contrast(1.08) saturate(1.12) brightness(.96)'; x.drawImage(FOTO,(W-fw)/2,dy,fw,fh); x.filter='none'; }
  x.globalCompositeOperation='multiply'; x.fillStyle='#a3b0cc'; x.fillRect(0,0,W,1200); x.globalCompositeOperation='source-over';
  var g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(10,22,48,.72)'); g.addColorStop(.14,'rgba(10,22,48,.12)'); g.addColorStop(.3,'rgba(10,22,48,.04)');
  g.addColorStop(.31,'rgba(10,22,48,.3)'); g.addColorStop(.4,'rgba(10,22,48,.72)'); g.addColorStop(.48,'rgba(10,22,48,.94)'); g.addColorStop(.535,'rgba(10,22,48,1)'); g.addColorStop(1,'rgba(10,22,48,1)');
  x.fillStyle=g; x.fillRect(0,0,W,H);

  // üst: logo + tarih
  logo(64,176,64);
  f(700,40,-.3); yaz(bugun.getDate()+' '+AY[bugun.getMonth()],W-64,176,BEYAZ,'right');
  f(400,30,0); yaz(GUN[bugun.getDay()],W-64,216,DIM,'right');
