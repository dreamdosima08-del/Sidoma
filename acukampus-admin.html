<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACU Kampüs Admin — Moderasyon Paneli</title>
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://artvinrehber.com/acukampus-admin.html">
<meta name="robots" content="noindex,nofollow">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d0d14;--bg2:#13131f;--bg3:#1a1a2e;
  --border:rgba(255,255,255,.08);
  --text:#eeeef5;--dim:rgba(238,238,245,.5);--soluk:rgba(238,238,245,.25);
  --mor:#7c3aed;--mor-c:#c4b5fd;
  --yesil:#22c55e;--kirmizi:#ef4444;--sari:#f59e0b;--mavi:#3b82f6;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;}

/* GİRİŞ */
#giris{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;}
.giris-kart{background:var(--bg2);border:1px solid rgba(124,58,237,.3);border-radius:16px;padding:2rem;width:100%;max-width:320px;text-align:center;}
.giris-h{font-size:1.1rem;font-weight:800;margin-bottom:.25rem;}
.giris-sub{font-size:.78rem;color:var(--dim);margin-bottom:1.25rem;}
.giris-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;color:var(--text);font-size:.9rem;outline:none;margin-bottom:.75rem;text-align:center;letter-spacing:.2em;font-family:system-ui;}
.giris-btn{width:100%;background:linear-gradient(135deg,var(--mor),#9333ea);color:#fff;border:none;border-radius:10px;padding:.8rem;font-size:.88rem;font-weight:700;cursor:pointer;}
.giris-hata{color:#f87171;font-size:.75rem;margin-bottom:.5rem;display:none;}

/* PANEL */
#panel{display:none;max-width:680px;margin:0 auto;padding:0 0 3rem;}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:50;background:rgba(13,13,20,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;}
.topbar-logo{font-size:.9rem;font-weight:800;color:var(--mor-c);}
.topbar-cikis{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--dim);font-size:.72rem;padding:.35rem .75rem;border-radius:8px;cursor:pointer;font-family:system-ui;}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);}
.tab{flex:1;padding:.7rem .5rem;text-align:center;font-size:.75rem;font-weight:600;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;}
.tab.aktif{color:var(--mor-c);border-bottom-color:var(--mor);}
.tab-badge{display:inline-block;background:rgba(239,68,68,.2);color:#f87171;border-radius:10px;padding:.05rem .4rem;font-size:.65rem;margin-left:.25rem;}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;padding:.75rem 1rem;}
.stat-kart{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:.75rem;text-align:center;}
.stat-n{font-size:1.4rem;font-weight:800;}
.stat-l{font-size:.6rem;color:var(--soluk);margin-top:.15rem;}

/* BÖLÜM */
.bolum{padding:.75rem 1rem 0;}
.bolum-h{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:.5rem;display:flex;align-items:center;justify-content:space-between;}

/* KART */
.ak{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:.9rem;margin-bottom:.5rem;transition:border-color .15s;}
.ak:hover{border-color:rgba(255,255,255,.14);}
.ak-ust{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;}
.ak-badge{font-size:.6rem;font-weight:700;padding:.18rem .5rem;border-radius:8px;}
.ak-nick{font-size:.78rem;font-weight:600;}
.ak-zaman{font-size:.62rem;color:var(--soluk);margin-left:auto;}
.ak-metin{font-size:.85rem;line-height:1.6;margin-bottom:.75rem;color:rgba(238,238,245,.85);word-break:break-word;}
.ak-butonlar{display:flex;gap:.4rem;flex-wrap:wrap;}
.btn{padding:.5rem .85rem;border-radius:8px;font-size:.75rem;font-weight:700;cursor:pointer;border:none;font-family:system-ui;min-height:36px;}
.btn-onayla{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;}
.btn-onayla:hover{background:rgba(34,197,94,.25);}
.btn-sil{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#f87171;}
.btn-sil:hover{background:rgba(239,68,68,.2);}
.btn-spam{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:#fcd34d;}
.btn-detay{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);color:#93c5fd;}

/* YORUM ALANI */
.ak-yorumlar{border-top:1px solid var(--border);margin-top:.6rem;padding-top:.6rem;display:none;}
.ak-yorumlar.acik{display:block;}
.yorum-item{background:var(--bg3);border-radius:8px;padding:.6rem .75rem;margin-bottom:.35rem;}
.yorum-nick{font-size:.72rem;font-weight:700;color:var(--mor-c);}
.yorum-metin{font-size:.8rem;color:var(--dim);margin-top:.2rem;line-height:1.5;}
.yorum-buton{font-size:.65rem;font-weight:700;color:#f87171;background:none;border:none;cursor:pointer;padding:.2rem .4rem;font-family:system-ui;}

/* BOS */
.bos{text-align:center;padding:2.5rem;color:var(--soluk);font-size:.85rem;}

/* HIZLI İŞLEMLER */
.hizli-wrap{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:.75rem 1rem;}
.hizli-btn{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:.85rem;text-align:center;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--dim);font-family:system-ui;}
.hizli-btn:hover{border-color:var(--mor);color:var(--mor-c);}
.hizli-ic{font-size:1.2rem;display:block;margin-bottom:.25rem;}
</style>
</head>
<body>

<!-- GİRİŞ -->
<div id="giris">
  <div class="giris-kart">
    <div style="font-size:1.75rem;margin-bottom:.5rem;">🔐</div>
    <div class="giris-h">ACU Admin</div>
    <div class="giris-sub">Moderasyon Paneli</div>
    <div class="giris-hata" id="hata">❌ Şifre yanlış</div>
    <input type="password" class="giris-input" id="sifreInput" placeholder="••••••" onkeydown="if(event.key==='Enter')girisYap()">
    <button class="giris-btn" onclick="girisYap()">Giriş Yap</button>
  </div>
</div>

<!-- PANEL -->
<div id="panel">

  <!-- TOPBAR -->
  <div class="topbar">
    <div>
      <div class="topbar-logo">🏫 ACU Admin</div>
      <div style="font-size:.6rem;color:var(--soluk);">Moderasyon Paneli</div>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center;">
      <a href="/acukampus.html" target="_blank" style="background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.2);color:var(--mor-c);font-size:.72rem;padding:.35rem .75rem;border-radius:8px;text-decoration:none;font-weight:600;">Siteyi Gör →</a>
      <button class="topbar-cikis" onclick="cikis()">Çıkış</button>
    </div>
  </div>

  <!-- İSTATİSTİKLER -->
  <div class="stats">
    <div class="stat-kart"><div class="stat-n" id="sToplam" style="color:var(--mor-c);">—</div><div class="stat-l">Toplam Gönderi</div></div>
    <div class="stat-kart"><div class="stat-n" id="sBekliyor" style="color:var(--sari);">—</div><div class="stat-l">Bekliyor</div></div>
    <div class="stat-kart"><div class="stat-n" id="sBildirim" style="color:var(--kirmizi);">—</div><div class="stat-l">Bildirilen</div></div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab aktif" id="tab1" onclick="tabSec(1)">📥 Bekleyenler <span class="tab-badge" id="tabBadge1">0</span></div>
    <div class="tab" id="tab2" onclick="tabSec(2)">✅ Aktifler</div>
    <div class="tab" id="tab3" onclick="tabSec(3)">🚩 Bildirilenler</div>
    <div class="tab" id="tab4" onclick="tabSec(4)">⚡ Hızlı İşlem</div>
  </div>

  <!-- İÇERİK -->
  <div id="tabIcerik"></div>
</div>

<script>
var SIFRE = '828615';
var firebaseConfig = {
  apiKey: "AIzaSyBCUemvYsklmdfHqhgq7D5hZwquKDUZVC0",
  authDomain: "acu-kampus.firebaseapp.com",
  projectId: "acu-kampus",
  storageBucket: "acu-kampus.firebasestorage.app",
  messagingSenderId: "356152793085",
  appId: "1:356152793085:web:38a6ae1ad911880cb2ab94"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

var KAT = {
  itiraf:{l:'İtiraf',e:'🤫',c:'#a855f7',bg:'rgba(168,85,247,.12)'},
  soru:{l:'Soru',e:'❓',c:'#3b82f6',bg:'rgba(59,130,246,.12)'},
  ilan:{l:'İlan',e:'🏠',c:'#22c55e',bg:'rgba(34,197,94,.12)'},
};
var aktifTab = 1;

function zamanFmt(ts){
  if(!ts)return '—';
  var f=Math.floor((Date.now()-ts.toMillis())/1000);
  if(f<60)return 'Az önce';
  if(f<3600)return Math.floor(f/60)+' dk önce';
  if(f<86400)return Math.floor(f/3600)+' sa önce';
  return Math.floor(f/86400)+' gün önce';
}

// ── GİRİŞ ──
function girisYap(){
  var s = document.getElementById('sifreInput').value;
  if(s === SIFRE){
    document.getElementById('giris').style.display='none';
    document.getElementById('panel').style.display='block';
    istatistik();
    tabSec(1);
  } else {
    document.getElementById('hata').style.display='block';
    document.getElementById('sifreInput').value='';
    setTimeout(function(){document.getElementById('hata').style.display='none';},2000);
  }
}
function cikis(){
  document.getElementById('giris').style.display='flex';
  document.getElementById('panel').style.display='none';
  document.getElementById('sifreInput').value='';
}

// ── İSTATİSTİK ──
function istatistik(){
  db.collection('acukampus').get().then(function(snap){
    var toplam=0,bekliyor=0,bildirim=0;
    snap.forEach(function(doc){
      if(doc.id==='__sayac__')return;
      toplam++;
      var d=doc.data();
      if(d.durum==='bekliyor')bekliyor++;
      if(d.bildirim&&d.bildirim>0)bildirim++;
    });
    document.getElementById('sToplam').textContent=toplam;
    document.getElementById('sBekliyor').textContent=bekliyor;
    document.getElementById('sBildirim').textContent=bildirim;
    document.getElementById('tabBadge1').textContent=bekliyor;
  });
}

// ── TAB SEÇ ──
function tabSec(n){
  aktifTab=n;
  [1,2,3,4].forEach(function(i){
    document.getElementById('tab'+i).className='tab'+(i===n?' aktif':'');
  });
  if(n===1)bekleyenleriYukle();
  else if(n===2)aktifleriYukle();
  else if(n===3)bildirilenleriYukle();
  else if(n===4)hizliIslem();
}

// ── KART HTML ──
function kartHTML(doc, mod){
  var d=doc.data();
  var k=KAT[d.kategori]||{l:d.kategori,e:'📌',c:'#888',bg:'rgba(136,136,136,.1)'};
  var html='<div class="ak" id="ak_'+doc.id+'">';
  html+='<div class="ak-ust">';
  html+='<span class="ak-badge" style="background:'+k.bg+';color:'+k.c+'">'+k.e+' '+k.l+'</span>';
  html+='<span class="ak-nick">'+( d.nick||'Anonim')+'</span>';
  if(d.bildirim&&d.bildirim>0) html+='<span style="background:rgba(239,68,68,.15);color:#f87171;font-size:.62rem;padding:.1rem .4rem;border-radius:6px;">🚩 '+d.bildirim+'</span>';
  html+='<span class="ak-zaman">'+zamanFmt(d.olusturma)+'</span>';
  html+='</div>';
  html+='<div class="ak-metin">'+d.metin.replace(/\n/g,'<br>')+'</div>';
  html+='<div class="ak-butonlar">';
  if(mod==='bekliyor'){
    html+='<button class="btn btn-onayla" onclick="onayla(\''+doc.id+'\')">✅ Onayla</button>';
    html+='<button class="btn btn-sil" onclick="sil(\''+doc.id+'\')">🗑️ Sil</button>';
    html+='<button class="btn btn-spam" onclick="spam(\''+doc.id+'\')">⚠️ Spam</button>';
  } else if(mod==='aktif'){
    html+='<button class="btn btn-sil" onclick="sil(\''+doc.id+'\')">🗑️ Kaldır</button>';
    html+='<button class="btn btn-detay" onclick="yorumlariGor(\''+doc.id+'\')">💬 Yorumlar ('+(d.yorumSayi||0)+')</button>';
  } else if(mod==='bildirim'){
    html+='<button class="btn btn-onayla" onclick="bildirimiTemizle(\''+doc.id+'\')">✅ Temizle</button>';
    html+='<button class="btn btn-sil" onclick="sil(\''+doc.id+'\')">🗑️ Kaldır</button>';
  }
  html+='</div>';
  // Yorum alanı
  html+='<div class="ak-yorumlar" id="ay_'+doc.id+'"><div style="font-size:.72rem;color:var(--soluk);">Yükleniyor...</div></div>';
  html+='</div>';
  return html;
}

// ── BEKLEYENLERİ YÜKLE ──
function bekleyenleriYukle(){
  var ic=document.getElementById('tabIcerik');
  ic.innerHTML='<div class="bolum"><div class="bolum-h">📥 Onay Bekleyen Gönderiler</div></div>';
  db.collection('acukampus').where('durum','==','bekliyor').onSnapshot(function(snap){
    var html='<div class="bolum"><div class="bolum-h">📥 Onay Bekleyen Gönderiler <span style="color:var(--soluk);">('+snap.size+')</span></div>';
    if(snap.empty){html+='<div class="bos">✅ Bekleyen gönderi yok!</div>';html+='</div>';ic.innerHTML=html;return;}
    snap.forEach(function(doc){if(doc.id!=='__sayac__')html+=kartHTML(doc,'bekliyor');});
    html+='</div>';
    ic.innerHTML=html;
    document.getElementById('tabBadge1').textContent=snap.size;
    document.getElementById('sBekliyor').textContent=snap.size;

    // Yorum bekleyenlerini de göster
    yorumBekleyenleriYukle(ic);
  });
}

// ── YORUM BEKLEYENLERİ ──
function yorumBekleyenleriYukle(ic){
  db.collection('acukampus').where('durum','==','aktif').get().then(function(postlar){
    var bekleyenYorumlar=[];
    var promises=[];
    postlar.forEach(function(postDoc){
      if(postDoc.id==='__sayac__')return;
      var p=db.collection('acukampus').doc(postDoc.id).collection('yorumlar').where('durum','==','bekliyor').get().then(function(ySnap){
        ySnap.forEach(function(yDoc){
          bekleyenYorumlar.push({postId:postDoc.id,postMetin:postDoc.data().metin,yDoc:yDoc});
        });
      });
      promises.push(p);
    });
    Promise.all(promises).then(function(){
      if(bekleyenYorumlar.length===0)return;
      var html='<div class="bolum" style="margin-top:.75rem;"><div class="bolum-h">💬 Onay Bekleyen Yorumlar <span style="color:var(--soluk);">('+bekleyenYorumlar.length+')</span></div>';
      bekleyenYorumlar.forEach(function(item){
        var y=item.yDoc.data();
        html+='<div class="ak" id="ay2_'+item.yDoc.id+'">';
        html+='<div style="font-size:.65rem;color:var(--soluk);margin-bottom:.35rem;">📝 Post: "'+item.postMetin.substring(0,50)+'..."</div>';
        html+='<div class="ak-ust"><span class="ak-nick">'+( y.nick||'Anonim')+'</span><span class="ak-zaman" style="margin-left:auto">Yorum</span></div>';
        html+='<div class="ak-metin">'+y.metin+'</div>';
        html+='<div class="ak-butonlar">';
        html+='<button class="btn btn-onayla" onclick="yorumOnayla(\''+item.postId+'\',\''+item.yDoc.id+'\')">✅ Onayla</button>';
        html+='<button class="btn btn-sil" onclick="yorumSil(\''+item.postId+'\',\''+item.yDoc.id+'\')">🗑️ Sil</button>';
        html+='</div></div>';
      });
      html+='</div>';
      ic.innerHTML+=html;
    });
  });
}

// ── AKTİFLERİ YÜKLE ──
function aktifleriYukle(){
  var ic=document.getElementById('tabIcerik');
  db.collection('acukampus').where('durum','==','aktif').get().then(function(snap){
    var html='<div class="bolum"><div class="bolum-h">✅ Aktif Gönderiler ('+snap.size+')</div>';
    if(snap.empty){html+='<div class="bos">Henüz aktif gönderi yok.</div>';}
    snap.forEach(function(doc){if(doc.id!=='__sayac__')html+=kartHTML(doc,'aktif');});
    html+='</div>';
    ic.innerHTML=html;
  });
}

// ── BİLDİRİLENLERİ YÜKLE ──
function bildirilenleriYukle(){
  var ic=document.getElementById('tabIcerik');
  db.collection('acukampus').where('durum','==','aktif').get().then(function(snap){
    var html='<div class="bolum"><div class="bolum-h">🚩 Bildirilen Gönderiler</div>';
    var var_mi=false;
    snap.forEach(function(doc){
      if(doc.id==='__sayac__')return;
      var d=doc.data();
      if(d.bildirim&&d.bildirim>0){var_mi=true;html+=kartHTML(doc,'bildirim');}
    });
    if(!var_mi)html+='<div class="bos">✅ Bildirilen gönderi yok.</div>';
    html+='</div>';
    ic.innerHTML=html;
  });
}

// ── HIZLI İŞLEM ──
function hizliIslem(){
  document.getElementById('tabIcerik').innerHTML=`
  <div class="hizli-wrap">
    <div class="hizli-btn" onclick="topluOnayla()"><span class="hizli-ic">✅</span>Tümünü Onayla</div>
    <div class="hizli-btn" onclick="topluSil()"><span class="hizli-ic">🗑️</span>Bekleyenleri Sil</div>
    <div class="hizli-btn" onclick="istatistikYenile()"><span class="hizli-ic">📊</span>İstatistik Yenile</div>
    <div class="hizli-btn" onclick="window.open('https://console.firebase.google.com/project/acu-kampus/firestore','_blank')"><span class="hizli-ic">🔥</span>Firebase Konsol</div>
    <div class="hizli-btn" onclick="window.open('https://artvinrehber.com/acukampus.html','_blank')"><span class="hizli-ic">👁️</span>Siteyi Gör</div>
    <div class="hizli-btn" onclick="bildirimleriTemizle()"><span class="hizli-ic">🚩</span>Tüm Bildirimleri Temizle</div>
  </div>
  <div class="bolum" style="margin-top:.5rem;">
    <div class="bolum-h">ℹ️ Bilgi</div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1rem;font-size:.78rem;color:var(--dim);line-height:1.8;">
      🔑 Şifre: 828615<br>
      📱 Telegram: Yeni gönderi/yorum bildirim alırsın<br>
      ✅ Onayla → Gönderi sitede görünür<br>
      🗑️ Sil → Kalıcı silme<br>
      ⚠️ Spam → Spam olarak işaretle ve sil<br>
      🚩 Bildirilen → Kullanıcıların şikayet ettiği içerikler
    </div>
  </div>`;
}

// ── ONAY / SİL ──
function onayla(id){
  db.collection('acukampus').doc(id).update({durum:'aktif'}).then(function(){
    kaldirKart('ak_'+id);
    istatistik();
  });
}
function sil(id){
  if(!confirm('Bu gönderiyi kalıcı silmek istediğinden emin misin?'))return;
  db.collection('acukampus').doc(id).delete().then(function(){
    kaldirKart('ak_'+id);
    istatistik();
  });
}
function spam(id){
  if(!confirm('Spam olarak işaretlenip silinecek. Emin misin?'))return;
  db.collection('acukampus').doc(id).delete().then(function(){
    kaldirKart('ak_'+id);
    istatistik();
  });
}
function bildirimiTemizle(id){
  db.collection('acukampus').doc(id).update({bildirim:0}).then(function(){
    kaldirKart('ak_'+id);
  });
}

// ── YORUM ONAY/SİL ──
function yorumOnayla(postId,yorumId){
  db.collection('acukampus').doc(postId).collection('yorumlar').doc(yorumId).update({durum:'aktif'}).then(function(){
    db.collection('acukampus').doc(postId).update({yorumSayi:firebase.firestore.FieldValue.increment(1)});
    kaldirKart('ay2_'+yorumId);
  });
}
function yorumSil(postId,yorumId){
  if(!confirm('Yorumu silmek istiyor musun?'))return;
  db.collection('acukampus').doc(postId).collection('yorumlar').doc(yorumId).delete().then(function(){
    kaldirKart('ay2_'+yorumId);
  });
}

// ── YORUMLARI GÖR ──
function yorumlariGor(postId){
  var alan=document.getElementById('ay_'+postId);
  if(!alan)return;
  alan.classList.toggle('acik');
  if(!alan.classList.contains('acik'))return;
  db.collection('acukampus').doc(postId).collection('yorumlar').get().then(function(snap){
    if(snap.empty){alan.innerHTML='<div style="font-size:.75rem;color:var(--soluk);">Yorum yok.</div>';return;}
    var html='';
    snap.forEach(function(doc){
      var y=doc.data();
      html+='<div class="yorum-item">';
      html+='<div style="display:flex;align-items:center;justify-content:space-between;">';
      html+='<span class="yorum-nick">'+( y.nick||'Anonim')+'</span>';
      html+='<span style="font-size:.6rem;color:var(--soluk);">'+y.durum+'</span>';
      html+='<button class="yorum-buton" onclick="yorumSil(\''+postId+'\',\''+doc.id+'\')">🗑️ Sil</button>';
      html+='</div>';
      html+='<div class="yorum-metin">'+y.metin+'</div>';
      html+='</div>';
    });
    alan.innerHTML=html;
  });
}

// ── TOPLU İŞLEMLER ──
function topluOnayla(){
  if(!confirm('Bekleyen tüm gönderiler onaylanacak. Emin misin?'))return;
  db.collection('acukampus').where('durum','==','bekliyor').get().then(function(snap){
    var batch=db.batch();
    snap.forEach(function(doc){if(doc.id!=='__sayac__')batch.update(doc.ref,{durum:'aktif'});});
    return batch.commit();
  }).then(function(){alert('✅ Tüm bekleyenler onaylandı.');istatistik();tabSec(1);});
}
function topluSil(){
  if(!confirm('Bekleyen tüm gönderiler silinecek. Emin misin?'))return;
  db.collection('acukampus').where('durum','==','bekliyor').get().then(function(snap){
    var batch=db.batch();
    snap.forEach(function(doc){if(doc.id!=='__sayac__')batch.delete(doc.ref);});
    return batch.commit();
  }).then(function(){alert('✅ Tüm bekleyenler silindi.');istatistik();tabSec(1);});
}
function istatistikYenile(){istatistik();alert('✅ İstatistikler yenilendi.');}
function bildirimleriTemizle(){
  if(!confirm('Tüm bildirim sayaçları sıfırlanacak?'))return;
  db.collection('acukampus').where('bildirim','>',0).get().then(function(snap){
    var batch=db.batch();
    snap.forEach(function(doc){batch.update(doc.ref,{bildirim:0});});
    return batch.commit();
  }).then(function(){alert('✅ Bildirimler temizlendi.');});
}

// ── YARDIMCI ──
function kaldirKart(id){
  var el=document.getElementById(id);
  if(el){el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(function(){el.remove();},300);}
}
</script>
