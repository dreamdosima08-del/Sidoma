<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Artvin Amatör Ligi — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--neon:#4dffb0;--neon2:#00e87a;--altin:#f5c842;--kirmizi:#ff4f5e;--cam:rgba(255,255,255,.06);--cam-k:rgba(255,255,255,.12);--metin:#e8f5ee;--soluk:rgba(232,245,238,.45);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:#0b1f13;background-image:radial-gradient(ellipse 120% 60% at 50% -10%,rgba(45,106,69,.5) 0%,transparent 55%),radial-gradient(ellipse 60% 40% at 90% 80%,rgba(26,77,46,.4) 0%,transparent 50%);color:var(--metin);font-family:'DM Sans',sans-serif;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(77,255,176,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(77,255,176,.03) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0;}
.sarici{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:1.5rem 1rem 3rem;}
.baslik-alan{text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(77,255,176,.15);}
.rozet{display:inline-flex;align-items:center;gap:.5rem;background:rgba(77,255,176,.08);border:1px solid rgba(77,255,176,.2);border-radius:50px;padding:.3rem .85rem;font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--neon);margin-bottom:1rem;}
.nokta{width:6px;height:6px;border-radius:50%;background:var(--neon);animation:blink 2s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,10vw,3rem);letter-spacing:.1em;color:#fff;line-height:1;margin-bottom:.3rem;}
.h1 span{color:var(--neon);}
.h1-alt{font-size:.75rem;color:var(--soluk);}
.son-gun{display:flex;align-items:center;justify-content:center;gap:.4rem;font-size:.65rem;color:var(--soluk);margin-bottom:1.5rem;font-family:'DM Mono',monospace;}
.canli{display:flex;align-items:center;gap:.3rem;color:var(--neon);}
.bolum-h{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.14em;color:var(--neon);margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem;}
.bolum-h::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(77,255,176,.3),transparent);}
.tab-bar{display:flex;gap:.4rem;margin-bottom:1.5rem;background:rgba(0,0,0,.2);border-radius:12px;padding:.35rem;}
.tab{flex:1;padding:.55rem .4rem;border-radius:9px;border:none;background:transparent;color:var(--soluk);font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:700;cursor:pointer;transition:.15s;text-align:center;}
.tab.aktif{background:rgba(77,255,176,.12);color:var(--neon);border:1px solid rgba(77,255,176,.2);}
.panel{display:none;}
.panel.aktif{display:block;}
/* TAKIM KARTLARI */
.puan-grid{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.5rem;}
.tkart{background:var(--cam);border:1px solid var(--cam-k);border-radius:14px;padding:.85rem 1rem;backdrop-filter:blur(12px);transition:border-color .2s;position:relative;}
.tkart::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
.tkart.lider::before{background:var(--neon);}
.tkart.playoff::before{background:var(--altin);}
.tkart.dusme::before,.tkart.ihrac::before{background:var(--kirmizi);}
.tkart:focus-within{border-color:rgba(77,255,176,.35);}
.t-ust{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem;}
.t-ad{font-weight:700;font-size:.9rem;color:#fff;}
.t-ad.ihrac{color:var(--kirmizi);text-decoration:line-through;opacity:.65;}
.dur-sec{font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.18rem .55rem;border-radius:4px;cursor:pointer;background:rgba(77,255,176,.1);color:var(--neon);border:1px solid rgba(77,255,176,.2);outline:none;}
.uc{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;}
.alan label{display:block;font-size:.52rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soluk);margin-bottom:.3rem;}
.alan input{width:100%;padding:.5rem .6rem;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.2);color:#fff;font-family:'DM Mono',monospace;font-size:1rem;font-weight:500;text-align:center;outline:none;transition:border-color .15s,background .15s;}
.alan input:focus{border-color:var(--neon);background:rgba(77,255,176,.06);}
.alan input.pi{color:var(--neon);font-size:1.1rem;}
.alan input.ai{color:var(--altin);}
/* MAÇ KARTLARI */
.mac-liste{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.75rem;}
.mkart{background:var(--cam);border:1px solid var(--cam-k);border-radius:12px;padding:.65rem .75rem;}
.mkart-ust{display:grid;grid-template-columns:1fr 2.5rem auto 2.5rem 1fr auto;gap:.35rem;align-items:center;margin-bottom:.35rem;}
.mkart input{padding:.42rem .45rem;border-radius:7px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.2);color:#fff;font-family:'DM Sans',sans-serif;font-size:.8rem;outline:none;}
.mkart input:focus{border-color:var(--neon);}
.skor-i{width:100%;text-align:center;font-family:'DM Mono',monospace;font-size:.95rem;color:var(--altin);}
.ayrac{font-family:'Bebas Neue',sans-serif;font-size:.9rem;color:var(--soluk);text-align:center;}
.sil-btn{width:28px;height:28px;border-radius:7px;border:1px solid rgba(255,79,94,.25);background:rgba(255,79,94,.1);color:var(--kirmizi);cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.alt-inp{width:100%;padding:.35rem .5rem;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.15);color:var(--soluk);font-size:.72rem;outline:none;font-family:'DM Sans',sans-serif;}
.alt-inp:focus{border-color:rgba(77,255,176,.3);color:var(--metin);}
/* BUTONLAR */
.btn-ekle{width:100%;padding:.6rem;border-radius:10px;border:1px dashed rgba(77,255,176,.25);background:transparent;color:rgba(77,255,176,.6);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;transition:.15s;margin-bottom:1rem;}
.btn-ekle:hover{border-color:var(--neon);color:var(--neon);background:rgba(77,255,176,.05);}
.btn-kaydet{width:100%;padding:.9rem;border-radius:12px;border:none;background:linear-gradient(135deg,var(--neon2),#00c866);color:#061a0c;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.14em;cursor:pointer;box-shadow:0 4px 24px rgba(0,232,122,.25);transition:.15s;margin-bottom:2rem;}
.btn-kaydet:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,232,122,.4);}
.mesaj{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,232,122,.15);border:1px solid rgba(0,232,122,.3);color:var(--neon);border-radius:10px;padding:.6rem 1.5rem;font-size:.82rem;font-weight:700;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:999;white-space:nowrap;}
.mesaj.goster{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="sarici">

  <div class="baslik-alan">
    <div class="rozet"><div class="nokta"></div> Admin Paneli</div>
    <h1 class="h1">ARTVİN<br><span>AMATÖR</span> LİG</h1>
    <p class="h1-alt">Puan · Sonuçlar · Fikstür</p>
  </div>

  <div class="son-gun" id="sonGun">
    <span class="canli"><div class="nokta"></div>Canlı</span>
    Henüz güncelleme yapılmadı
  </div>

  <div class="tab-bar">
    <button class="tab aktif" onclick="tabSec(0)">🏆 Puan</button>
    <button class="tab" onclick="tabSec(1)">⚽ Sonuçlar</button>
    <button class="tab" onclick="tabSec(2)">📅 Fikstür</button>
  </div>

  <div class="panel aktif" id="p0">
    <div class="bolum-h">Puan Durumu</div>
    <div class="puan-grid" id="puanGrid"></div>
    <button class="btn-kaydet" onclick="puanKaydet()">💾 PUAN TABLOSUNU KAYDET</button>
  </div>

  <div class="panel" id="p1">
    <div class="bolum-h">Bu Haftanın Sonuçları</div>
    <div class="mac-liste" id="sonucListe"></div>
    <button class="btn-ekle" onclick="sonucEkle()">+ Maç Ekle</button>
    <button class="btn-kaydet" onclick="sonucKaydet()">💾 SONUÇLARI KAYDET</button>
  </div>

  <div class="panel" id="p2">
    <div class="bolum-h">Gelecek Haftanın Maçları</div>
    <div class="mac-liste" id="fiksturListe"></div>
    <button class="btn-ekle" onclick="fiksturEkle()">+ Maç Ekle</button>
    <button class="btn-kaydet" onclick="fiksturKaydet()">💾 FİKSTÜRÜ KAYDET</button>
  </div>

</div>
<div class="mesaj" id="mesaj"></div>

<script>
var T=[
  {takim:"Borçkaspor",          o:11,av:"+48",puan:28,durum:"lider"},
  {takim:"Yusufelispor",        o:11,av:"+22",puan:28,durum:"lider"},
  {takim:"Hopa Spor Eğitim",    o:12,av:"+9", puan:22,durum:"normal"},
  {takim:"Artvin Kemalpaşaspor",o:11,av:"+19",puan:21,durum:"playoff"},
  {takim:"Şavşat Gençlikspor",  o:11,av:"-31",puan:12,durum:"normal"},
  {takim:"Yeşil Artvinspor",    o:12,av:"-32",puan:3, durum:"ihrac"},
  {takim:"Muratlı Hudutspor",   o:12,av:"-41",puan:0, durum:"ihrac"}
];
var S=[], F=[];
var DUR_AD={lider:"Lider",playoff:"Play-Off",normal:"Normal",dusme:"Düşme",ihrac:"İhraç"};

function tabSec(n){
  document.querySelectorAll('.tab').forEach(function(t,i){t.classList.toggle('aktif',i===n);});
  document.querySelectorAll('.panel').forEach(function(p,i){p.classList.toggle('aktif',i===n);});
}

function puanRender(){
  var el=document.getElementById('puanGrid');el.innerHTML='';
  T.forEach(function(r,i){
    var opts=Object.keys(DUR_AD).map(function(d){return '<option value="'+d+'"'+(r.durum===d?' selected':'')+'>'+DUR_AD[d]+'</option>';}).join('');
    el.innerHTML+='<div class="tkart '+r.durum+'">'+
      '<div class="t-ust">'+
        '<div class="t-ad'+(r.durum==='ihrac'?' ihrac':'')+'">'+r.takim+'</div>'+
        '<select class="dur-sec" onchange="T['+i+'].durum=this.value;puanRender()">'+opts+'</select>'+
      '</div>'+
      '<div class="uc">'+
        '<div class="alan"><label>Oynanan</label><input type="number" value="'+r.o+'" onchange="T['+i+'].o=+this.value"></div>'+
        '<div class="alan"><label>Averaj</label><input class="ai" value="'+r.av+'" onchange="T['+i+'].av=this.value"></div>'+
        '<div class="alan"><label>Puan</label><input class="pi" type="number" value="'+r.puan+'" onchange="T['+i+'].puan=+this.value"></div>'+
      '</div>'+
    '</div>';
  });
}

function puanKaydet(){
  var t=zaman();
  localStorage.setItem('artvin_puan',JSON.stringify(T));
  localStorage.setItem('artvin_puan_tarih',t);
  document.getElementById('sonGun').innerHTML='<span class="canli"><div class="nokta"></div>Canlı</span> Son güncelleme: '+t;
  flash('✅ Puan tablosu kaydedildi!');
}

function sonucEkle(){S.push({tarih:'',ev:'',dep:'',eg:'',dg:''});sonucRender();}
function sonucSil(i){S.splice(i,1);sonucRender();}
function sonucRender(){
  var el=document.getElementById('sonucListe');
  if(!S.length){el.innerHTML='<div style="color:var(--soluk);font-size:.8rem;text-align:center;padding:1rem 0">+ butonuyla maç ekleyin</div>';return;}
  el.innerHTML='';
  S.forEach(function(r,i){
    el.innerHTML+=
      '<div class="mkart">'+
        '<div class="mkart-ust">'+
          '<input placeholder="Ev Sahibi" value="'+r.ev+'" onchange="S['+i+'].ev=this.value">'+
          '<input class="skor-i" placeholder="0" type="number" value="'+r.eg+'" onchange="S['+i+'].eg=this.value">'+
          '<span class="ayrac">—</span>'+
          '<input class="skor-i" placeholder="0" type="number" value="'+r.dg+'" onchange="S['+i+'].dg=this.value">'+
          '<input placeholder="Deplasman" value="'+r.dep+'" onchange="S['+i+'].dep=this.value">'+
          '<button class="sil-btn" onclick="sonucSil('+i+')">✕</button>'+
        '</div>'+
        '<input class="alt-inp" placeholder="📅 Tarih (örn: 12/04/2026)" value="'+r.tarih+'" onchange="S['+i+'].tarih=this.value">'+
      '</div>';
  });
}
function sonucKaydet(){localStorage.setItem('artvin_sonuclar',JSON.stringify(S));flash('✅ Sonuçlar kaydedildi!');}

function fiksturEkle(){F.push({tarih:'',saat:'14:00',ev:'',dep:''});fiksturRender();}
function fiksturSil(i){F.splice(i,1);fiksturRender();}
function fiksturRender(){
  var el=document.getElementById('fiksturListe');
  if(!F.length){el.innerHTML='<div style="color:var(--soluk);font-size:.8rem;text-align:center;padding:1rem 0">+ butonuyla maç ekleyin</div>';return;}
  el.innerHTML='';
  F.forEach(function(r,i){
    el.innerHTML+=
      '<div class="mkart">'+
        '<div class="mkart-ust" style="grid-template-columns:1fr 3.5rem 4.5rem auto">'+
          '<input placeholder="Ev Sahibi" value="'+r.ev+'" onchange="F['+i+'].ev=this.value">'+
          '<input style="text-align:center;font-family:DM Mono,monospace;font-size:.8rem" placeholder="14:00" value="'+r.saat+'" onchange="F['+i+'].saat=this.value">'+
          '<input style="font-size:.75rem" placeholder="12/04" value="'+r.tarih+'" onchange="F['+i+'].tarih=this.value">'+
          '<button class="sil-btn" onclick="fiksturSil('+i+')">✕</button>'+
        '</div>'+
        '<input class="alt-inp" placeholder="Deplasman takımı" value="'+r.dep+'" onchange="F['+i+'].dep=this.value">'+
      '</div>';
  });
}
function fiksturKaydet(){localStorage.setItem('artvin_fikstur',JSON.stringify(F));flash('✅ Fikstür kaydedildi!');}

function zaman(){return new Date().toLocaleDateString('tr-TR')+' '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});}
function flash(msg){var el=document.getElementById('mesaj');el.textContent=msg;el.classList.add('goster');setTimeout(function(){el.classList.remove('goster');},2500);}

window.onload=function(){
  var sp=localStorage.getItem('artvin_puan');if(sp)T=JSON.parse(sp);
  var st=localStorage.getItem('artvin_puan_tarih');
  if(st)document.getElementById('sonGun').innerHTML='<span class="canli"><div class="nokta"></div>Canlı</span> Son güncelleme: '+st;
  var ss=localStorage.getItem('artvin_sonuclar');if(ss)S=JSON.parse(ss);
  var sf=localStorage.getItem('artvin_fikstur');if(sf)F=JSON.parse(sf);
  puanRender();sonucRender();fiksturRender();
};
</script>
</body>
</html>
