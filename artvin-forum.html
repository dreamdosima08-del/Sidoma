<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ArtvinForum 2026 — Artvin Yaşam, Kültür ve Sosyal Hayat</title>
<meta name="description" content="ArtvinForum — Artvin hakkında her şey. Kiralık ev, iş ilanı, yemek tarifleri, kültür, doğa. Artvinlilerin dijital buluşma noktası 2026.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://artvinrehber.com/artvin-forum.html">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a1a0f;--bg2:#0f2318;--border:rgba(255,255,255,.07);--text:#e8f0ea;--dim:rgba(232,240,234,.55);--soluk:rgba(232,240,234,.28);--yesil:#2d7a4f;--yesil2:#3ddb8a;--yesilac:#a8e6c0}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem}
.kart{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem;max-width:420px;width:100%;text-align:center}
.logo{width:56px;height:56px;background:linear-gradient(135deg,#1b5e38,#2d7a4f);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:900;color:#fff;margin:0 auto 1.25rem;border:1px solid rgba(61,219,138,.3)}
.baslik{font-size:1.3rem;font-weight:900;color:var(--yesilac);margin-bottom:.5rem}
.alt{font-size:.82rem;color:var(--dim);line-height:1.65;margin-bottom:1.5rem}
.sure{display:inline-flex;align-items:center;gap:.4rem;background:rgba(61,219,138,.08);border:1px solid rgba(61,219,138,.2);border-radius:20px;padding:.45rem 1rem;font-size:.78rem;color:var(--yesilac);font-weight:600;margin-bottom:1.5rem}
.pulse{width:8px;height:8px;background:var(--yesil2);border-radius:50%;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
.links{display:flex;flex-direction:column;gap:.5rem}
.link{display:flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:11px;padding:.65rem .85rem;text-decoration:none;color:var(--text)}
.link-isim{font-size:.78rem;font-weight:700;flex:1;text-align:left}
.link-ok{font-size:.72rem;color:var(--yesilac);font-weight:700}
.footer-txt{margin-top:1.5rem;font-size:.65rem;color:var(--soluk)}
.footer-txt a{color:var(--yesilac);text-decoration:none}
</style>
</head>
<body>
<div class="kart">
  <div class="logo">AF</div>
  <div class="baslik">ArtvinForum</div>
  <div class="alt">Forum yakında hizmetinizde! Artvin'de yaşam, iş, yemek, kültür ve daha fazlası için toplanma noktanız hazırlanıyor.</div>
  <div class="sure"><div class="pulse"></div> Çok yakında</div>
  <div class="links">
    <a href="/acukampus.html" class="link" rel="noopener">
      <span style="font-size:1rem">🎓</span>
      <div style="flex:1;text-align:left"><div class="link-isim">ACU Kampüs</div><div style="font-size:.62rem;color:var(--soluk)">AÇÜ öğrenci platformu</div></div>
      <span class="link-ok">→</span>
    </a>
    <a href="/" class="link" rel="noopener">
      <span style="font-size:1rem">🌿</span>
      <div style="flex:1;text-align:left"><div class="link-isim">Artvin Rehberi</div><div style="font-size:.62rem;color:var(--soluk)">Ana sayfa</div></div>
      <span class="link-ok">→</span>
    </a>
  </div>
</div>
<div class="footer-txt">© 2026 <a href="/" rel="noopener">artvinrehber.com</a></div>
</body>
</html>
