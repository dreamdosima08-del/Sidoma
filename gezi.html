const sliderIndex = {};

function sliderGit(id, yon){
  const yer = YERLER.find(y => y.id === id);
  const fotolar = [yer.foto, yer.foto2, yer.foto3, yer.foto4, yer.foto5].filter(Boolean);
  if(!sliderIndex[id]) sliderIndex[id] = 0;
  sliderIndex[id] = (sliderIndex[id] + yon + fotolar.length) % fotolar.length;
  sliderUygula(id, fotolar.length);
}

function sliderSec(id, i){
  const yer = YERLER.find(y => y.id === id);
  const fotolar = [yer.foto, yer.foto2, yer.foto3, yer.foto4, yer.foto5].filter(Boolean);
  sliderIndex[id] = i;
  sliderUygula(id, fotolar.length);
}

function sliderUygula(id, toplam){
  const track = document.getElementById('track_' + id);
  if(track) track.style.transform = `translateX(-${sliderIndex[id] * 100}%)`;
  const dots = document.querySelectorAll(`#dots_${id} .dot`);
  dots.forEach((d,i) => d.classList.toggle('aktif', i === sliderIndex[id]));
}

let aktifKat = "tumu";

function render(){
  const grid = document.getElementById('kartGrid');
  grid.innerHTML = '';
  YERLER.forEach(yer => {
    const kart = document.createElement('div');
    kart.className = 'yer-kart';
    kart.dataset.id = yer.id;
    kart.dataset.kat = yer.kategori;
    kart.innerHTML = `
      ${yer.foto
        ? `<img class="yer-foto" src="${yer.foto}" alt="${yer.baslik}" loading="lazy">`
        : `<div class="yer-foto-placeholder">${yer.ikon}</div>`}
      <div class="yer-body">
        <div class="yer-kategori">${yer.kategoriLabel}</div>
        <div class="yer-baslik">${yer.baslik}</div>
        <div class="yer-ilce">📍 ${yer.ilce}</div>
        <div class="yer-ozet">${yer.ozet}</div>
      </div>
      <div class="yer-footer">
        <button class="yer-detay-btn" onclick="modalAc('${yer.id}')">Detay & Harita →</button>
        <div class="yer-ulasim">🚗 ${yer.nasil.split('.')[0]}</div>
      </div>`;
    grid.appendChild(kart);
  });
  guncelleSayac();
}

function kategoriSec(btn){
  document.querySelectorAll('.filtre-btn').forEach(b => b.classList.remove('aktif'));
  btn.classList.add('aktif');
  aktifKat = btn.dataset.kat;
  filtrele();
}

function filtrele(){
  const ara = document.getElementById('aramaInput').value.toLowerCase().trim();
  let gorSayisi = 0;
  document.querySelectorAll('.yer-kart').forEach(kart => {
    const id = kart.dataset.id;
    const yer = YERLER.find(y => y.id === id);
    const katEsles = aktifKat === 'tumu' || kart.dataset.kat === aktifKat;
    const araEsles = !ara || yer.baslik.toLowerCase().includes(ara) || yer.ilce.toLowerCase().includes(ara) || yer.ozet.toLowerCase().includes(ara);
    const goster = katEsles && araEsles;
    kart.classList.toggle('gizli', !goster);
    if(goster) gorSayisi++;
  });
  document.getElementById('sonucBilgi').textContent = gorSayisi + ' yer gösteriliyor';
  document.getElementById('bosMesaj').style.display = gorSayisi === 0 ? 'block' : 'none';
  document.getElementById('toplamYer').textContent = gorSayisi;
}

function modalAc(id){
  const yer = YERLER.find(y => y.id === id);
  if(!yer) return;
  const url = 'https://artvinrehber.com/gezi.html#' + id;
  
  // Fotoğrafları topla
  const fotolar = [yer.foto, yer.foto2, yer.foto3, yer.foto4, yer.foto5].filter(Boolean);
  
  let fotoHtml = '';
  if(fotolar.length === 0){
    fotoHtml = `<div class="modal-foto-placeholder">${yer.ikon}</div>`;
  } else if(fotolar.length === 1){
    fotoHtml = `<img class="modal-foto" src="${fotolar[0]}" alt="${yer.baslik}">`;
  } else {
    fotoHtml = `<div class="slider" id="slider_${id}">
      <div class="slider-track" id="track_${id}">
        ${fotolar.map(f => `<img class="slider-img" src="${f}" alt="${yer.baslik}" loading="lazy">`).join('')}
      </div>
      <button class="slider-btn slider-prev" onclick="sliderGit('${id}',-1)">&#8249;</button>
      <button class="slider-btn slider-next" onclick="sliderGit('${id}',1)">&#8250;</button>
      <div class="slider-dots" id="dots_${id}">
        ${fotolar.map((_,i) => `<span class="dot ${i===0?'aktif':''}" onclick="sliderSec('${id}',${i})"></span>`).join('')}
      </div>
    </div>`;
  }

  document.getElementById('modalBody').innerHTML = `
    ${fotoHtml}
    <div class="modal-icerik">
      <div class="modal-kategori">${yer.kategoriLabel}</div>
      <div class="modal-baslik">${yer.baslik}</div>
      <div class="modal-ilce">📍 ${yer.ilce}</div>
      <div class="modal-metin">${yer.metin}</div>
      <div class="modal-bilgi-baslik">🚗 Nasıl Gidilir?</div>
      <div style="font-size:.85rem;color:rgba(255,255,255,.6);line-height:1.7">${yer.nasil}</div>
      <div class="modal-bilgi-baslik">📍 Harita</div>
      <iframe class="modal-harita" src="${yer.harita}" allowfullscreen loading="lazy"></iframe>
      <div class="modal-bilgi-baslik">🗺️ Benzer Yerler</div>
      <div class="modal-benzer">${yer.benzer.map(b=>`<span>${b}</span>`).join('')}</div>
      <div class="en-ozet"><div class="en-ozet-baslik">English Summary</div><div class="en-ozet-metin">${yer.en}</div></div>
      <div class="modal-paylasim">
        <button class="mp-btn mp-kopyala" onclick="mpKopyala('${url}', this)">🔗 Kopyala</button>
        <a class="mp-btn mp-wp" href="https://api.whatsapp.com/send?text=${encodeURIComponent(yer.baslik + ' — ' + url)}" target="_blank" rel="noopener">📱 WhatsApp</a>
        <a class="mp-btn mp-x" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(yer.baslik)}&url=${encodeURIComponent(url)}&via=artvindeen" target="_blank" rel="noopener">𝕏 Paylaş</a>
        <span class="kopyalandi-msg" id="kpMsg">✓ Kopyalandı!</span>
      </div>
    </div>`;
  document.getElementById('modalOverlay').classList.add('acik');
  document.body.style.overflow = 'hidden';
  sliderIndex[id] = 0;
}

function modalKapat(e){
  if(e && e.target !== document.getElementById('modalOverlay') && !e.target.classList.contains('modal-kapat')) return;
  document.getElementById('modalOverlay').classList.remove('acik');
  document.body.style.overflow = '';
}

function mpKopyala(url, btn){
  navigator.clipboard.writeText(url).then(()=>{
    const msg = document.getElementById('kpMsg');
    if(msg){msg.style.display='inline';setTimeout(()=>{msg.style.display='none'},2000);}
  });
}

function guncelleSayac(){
  document.getElementById('toplamYer').textContent = YERLER.length;
  document.getElementById('sonucBilgi').textContent = YERLER.length + ' yer gösteriliyor';
}

render();
</script>
