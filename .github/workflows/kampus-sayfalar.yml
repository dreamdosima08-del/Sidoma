name: AÇÜ Kampüs forum sayfaları

# Forumdaki konulardan Google'ın okuyabileceği statik sayfaları üretir.
# Saatte bir çalışır; yalnızca bir şey değiştiyse commit atar.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'araclar/kampus-uret.mjs'
      - 'kampus/sabit.json'
      - '.github/workflows/kampus-sayfalar.yml'

permissions:
  contents: write

concurrency:
  group: kampus-sayfalar
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sayfaları üret
        run: node araclar/kampus-uret.mjs
      - name: Değişiklik varsa gönder
        run: |
          git config user.name "kampus-bot"
          git config user.email "kampus-bot@users.noreply.github.com"
          git add -A kampus acukampus.html sitemap-kampus.xml
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "AÇÜ Kampüs: forum sayfaları güncellendi"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
